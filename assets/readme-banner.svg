<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0E" />
      <stop offset="50%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#07080A" />
    </linearGradient>

    <!-- Indigo/Cyan Glows -->
    <radialGradient id="glowIndigo" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="75%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="bannerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Shimmer Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingDot {
      0% { r: 4; opacity: 1; }
      50% { r: 9; opacity: 0.4; }
      100% { r: 14; opacity: 0; }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }

    .pulse-layer { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .radar-orbit { animation: radarSpin 14s linear infinite; transform-origin: 145px 175px; }
    .radar-orbit-rev { animation: radarSpin 10s linear infinite reverse; transform-origin: 145px 175px; }
    .chart-path { stroke-dasharray: 600; animation: waveFlow 4s ease-out forwards; }
    .live-ping { animation: pingDot 2s cubic-bezier(0, 0, 0.2, 1) infinite; transform-origin: 85px 44px; }
    .floating-badge-1 { animation: badgeFloat 5s ease-in-out infinite; }
    .floating-badge-2 { animation: badgeFloat 6s ease-in-out 1s infinite; }
    .floating-badge-3 { animation: badgeFloat 5.5s ease-in-out 2s infinite; }
    .floating-badge-4 { animation: badgeFloat 6.5s ease-in-out 0.5s infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Texture -->
  <rect width="1200" height="420" rx="16" fill="url(#bannerGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="180" r="280" fill="url(#glowIndigo)" class="pulse-layer" />
  <circle cx="950" cy="240" r="260" fill="url(#glowCyan)" class="pulse-layer" />

  <!-- Top Accent Shimmer Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#borderGlow)" />
  <rect x="0" y="417" width="1200" height="3" fill="url(#borderGlow)" opacity="0.4" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Background Market Chart Wave -->
  <g opacity="0.65">
    <path d="M 400 350 Q 520 280 620 310 T 780 230 T 940 260 T 1100 160 T 1200 140 L 1200 418 L 400 418 Z" fill="url(#chartAreaGrad)" />
    <path class="chart-path" d="M 400 350 Q 520 280 620 310 T 780 230 T 940 260 T 1100 160 T 1200 140" fill="none" stroke="url(#chartLineGrad)" stroke-width="3.5" filter="url(#neonGlow)" />
    
    <!-- Target Point Marker -->
    <circle cx="1100" cy="160" r="5" fill="#34d399" filter="url(#neonGlow)" />
    <circle cx="1100" cy="160" r="9" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7" />
    <text x="1080" y="140" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">+4.2% AI TARGET</text>
  </g>

  <!-- Live Status Bar -->
  <g transform="translate(45, 30)">
    <rect x="0" y="0" width="410" height="28" rx="14" fill="#0F1115" stroke="#1E293B" stroke-width="1" />
    <circle class="live-ping" cx="16" cy="14" r="4" fill="#10b981" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="32" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">LIVE ENGINE ONLINE</text>
    <text x="180" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">•</text>
    <text x="195" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">3s Real-Time Ticks</text>
    <text x="315" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">•</text>
    <text x="330" y="18" fill="#818cf8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Gemini 2.5</text>
  </g>

  <!-- Animated Tech Emblem / Logo Symbol -->
  <g transform="translate(45, 85)">
    <!-- Rotating Geometric Rings -->
    <circle class="radar-orbit" cx="100" cy="90" r="72" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="6,8" opacity="0.6" />
    <circle class="radar-orbit-rev" cx="100" cy="90" r="84" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,10" opacity="0.4" />
    
    <!-- Outer Hex Shield -->
    <rect x="35" y="25" width="130" height="130" rx="28" fill="#0F1115" stroke="#312e81" stroke-width="2" />
    <rect x="42" y="32" width="116" height="116" rx="22" fill="#161920" stroke="#4338ca" stroke-width="1" />
    
    <!-- Glowing Core Logo: Rising Chart & Geometric A -->
    <g transform="translate(56, 46)">
      <!-- Candle 1 -->
      <line x1="20" y1="35" x2="20" y2="65" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
      <rect x="16" y="42" width="8" height="16" rx="2" fill="#38bdf8" />
      
      <!-- Candle 2 -->
      <line x1="38" y1="20" x2="38" y2="75" stroke="#818cf8" stroke-width="2" opacity="0.6" />
      <rect x="34" y="30" width="8" height="30" rx="2" fill="#818cf8" />
      
      <!-- Candle 3 (Highest) -->
      <line x1="56" y1="10" x2="56" y2="70" stroke="#34d399" stroke-width="2" opacity="0.7" />
      <rect x="52" y="18" width="8" height="40" rx="2" fill="#34d399" />

      <!-- Rising Exponential Curve Arrow -->
      <path d="M 12 70 Q 35 60 55 25 L 68 12" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
      <polygon points="68,8 74,16 63,16" fill="#F8FAFC" />
    </g>

    <!-- Central Node Glow -->
    <circle cx="100" cy="90" r="3" fill="#38bdf8" filter="url(#neonGlow)" />
  </g>

  <!-- Typography & Hero Copy -->
  <g transform="translate(245, 95)">
    <!-- Main Title -->
    <text x="0" y="65" fill="url(#textGrad)" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">
      Artha<tspan fill="#38BDF8">AI</tspan>
    </text>

    <!-- Version Badge -->
    <rect x="250" y="22" width="70" height="24" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
    <text x="285" y="38" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">v2.4.0</text>

    <!-- Subtitle -->
    <text x="0" y="105" fill="#E2E8F0" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3">
      Real-Time Algorithmic Trading &amp; Market Intelligence Platform
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="135" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400">
      Engineered for NSE/BSE simulation with automated rule execution, Gemini 2.5 sentiment analysis,
    </text>
    <text x="0" y="156" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400">
      multi-tier SIP &amp; Lumpsum wealth forecasting, and instant virtual portfolio balance tracking.
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 182)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="26" rx="6" fill="#0F1115" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">⚡ Instant Order Fill</text>

      <!-- Tag 2 -->
      <rect x="145" y="0" width="145" height="26" rx="6" fill="#0F1115" stroke="#334155" stroke-width="1" />
      <text x="157" y="17" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">🧠 Gemini Sentiment</text>

      <!-- Tag 3 -->
      <rect x="300" y="0" width="130" height="26" rx="6" fill="#0F1115" stroke="#334155" stroke-width="1" />
      <text x="312" y="17" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">📈 SIP Wealth Pro</text>

      <!-- Tag 4 -->
      <rect x="440" y="0" width="150" height="26" rx="6" fill="#0F1115" stroke="#334155" stroke-width="1" />
      <text x="452" y="17" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">🛡️ Rule-Based Limits</text>
    </g>
  </g>

  <!-- Metric Badges (Floating on Right Side) -->
  <g transform="translate(930, 60)">
    <!-- Card 1: Execution Latency -->
    <g class="floating-badge-1" transform="translate(0, 0)">
      <rect width="220" height="64" rx="12" fill="#0F1115" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="28" cy="32" r="14" fill="#1E1B4B" />
      <path d="M 28 24 L 28 32 L 34 36" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round" />
      <text x="52" y="27" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-transform="uppercase">TICK REFRESH</text>
      <text x="52" y="47" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">3.00 SEC</text>
    </g>

    <!-- Card 2: Backtest Rate -->
    <g class="floating-badge-2" transform="translate(0, 76)">
      <rect width="220" height="64" rx="12" fill="#0F1115" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="28" cy="32" r="14" fill="#064E3B" />
      <path d="M 22 32 L 26 36 L 34 26" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="52" y="27" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-transform="uppercase">BACKTEST RATE</text>
      <text x="52" y="47" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">87.4% WIN</text>
    </g>

    <!-- Card 3: Live Capital -->
    <g class="floating-badge-3" transform="translate(0, 152)">
      <rect width="220" height="64" rx="12" fill="#0F1115" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="28" cy="32" r="14" fill="#164E63" />
      <text x="28" y="37" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle">₹</text>
      <text x="52" y="27" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-transform="uppercase">VIRTUAL CAPITAL</text>
      <text x="52" y="47" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">₹1,00,000</text>
    </g>

    <!-- Card 4: Algorithmic Triggers -->
    <g class="floating-badge-4" transform="translate(0, 228)">
      <rect width="220" height="64" rx="12" fill="#0F1115" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="28" cy="32" r="14" fill="#312E81" />
      <polygon points="28,24 33,31 38,24 38,36 34,36 34,30 33,32 28,24" fill="#A5B4FC" />
      <text x="52" y="27" fill="#64748B" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-transform="uppercase">EXECUTION LOGS</text>
      <text x="52" y="47" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">AUTO-ORDER</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <g transform="translate(45, 360)">
    <rect width="840" height="36" rx="8" fill="#090A0D" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="23" fill="#6366F1" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">$</text>
    <text x="32" y="23" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">git clone https://github.com/garvshaw89/ArthaAI.git &amp;&amp; npm install &amp;&amp; npm run dev</text>
    <rect x="765" y="8" width="60" height="20" rx="4" fill="#1E293B" />
    <text x="795" y="22" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">READY</text>
  </g>
</svg>
