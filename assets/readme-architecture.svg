<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161920" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes flowLeftToRight {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5; opacity: 0.8; }
      50% { r: 8; opacity: 1; }
    }
    @keyframes packetMove {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: flowLeftToRight 4s linear infinite;
    }
    .pulse-dot {
      animation: pulseNode 2s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="360" rx="14" fill="#0A0B0E" stroke="#1E293B" stroke-width="1.2" />

  <!-- Section Title -->
  <g transform="translate(30, 32)">
    <circle cx="8" cy="8" r="4" fill="#6366F1" />
    <text x="22" y="12" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">
      SYSTEM ARCHITECTURE &amp; EXECUTION PIPELINE
    </text>
    <text x="375" y="12" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">
      [EVENT-DRIVEN • CONTINUOUS TICK CYCLE]
    </text>
  </g>

  <!-- Connecting Lines with Animated Dash -->
  <!-- Line 1: Market Feed -> Strategy Engine -->
  <path class="flow-line" d="M 230 160 L 380 160" fill="none" stroke="#6366F1" stroke-width="2.5" />
  
  <!-- Line 2: Gemini AI -> Strategy Engine -->
  <path class="flow-line" d="M 230 270 L 310 270 L 310 185 L 380 185" fill="none" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Line 3: Strategy Engine -> Order Fill & Portfolio -->
  <path class="flow-line" d="M 600 170 L 750 170" fill="none" stroke="#34D399" stroke-width="2.5" />

  <!-- Line 4: SIP Modeler feedback to Portfolio -->
  <path class="flow-line" d="M 855 235 L 855 205" fill="none" stroke="#A855F7" stroke-width="2.5" />

  <!-- Flow Direction Arrows / Markers -->
  <polygon points="378,160 368,155 368,165" fill="#6366F1" />
  <polygon points="378,185 368,180 368,190" fill="#38BDF8" />
  <polygon points="748,170 738,165 738,175" fill="#34D399" />
  <polygon points="855,207 850,217 860,217" fill="#A855F7" />

  <!-- Node 1: Real-Time Market Simulator -->
  <g transform="translate(30, 110)">
    <rect width="200" height="95" rx="10" fill="url(#cardGrad)" stroke="#312E81" stroke-width="1.5" />
    <circle cx="24" cy="28" r="10" fill="#1E1B4B" />
    <circle cx="24" cy="28" r="4" fill="#818CF8" class="pulse-dot" />
    <text x="44" y="26" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">01. INGESTION</text>
    <text x="44" y="42" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Market Tick Feed</text>
    <text x="16" y="66" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">3-second algorithmic pulse</text>
    <text x="16" y="80" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">NIFTY, SENSEX, NSE Equities</text>
  </g>

  <!-- Node 2: Gemini 2.5 AI Sentiment Analysis -->
  <g transform="translate(30, 225)">
    <rect width="200" height="95" rx="10" fill="url(#cardGrad)" stroke="#0E7490" stroke-width="1.5" />
    <circle cx="24" cy="28" r="10" fill="#164E63" />
    <circle cx="24" cy="28" r="4" fill="#38BDF8" class="pulse-dot" />
    <text x="44" y="26" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">02. INTELLIGENCE</text>
    <text x="44" y="42" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Gemini 2.5 AI</text>
    <text x="16" y="66" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Real-time macro sentiment</text>
    <text x="16" y="80" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">News &amp; FII/DII flow synthesis</text>
  </g>

  <!-- Node 3: Algorithmic Strategy Execution Core (Centerpiece) -->
  <g transform="translate(380, 100)">
    <rect width="220" height="135" rx="12" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="2" filter="url(#glowEffect)" opacity="0.3" />
    <rect width="220" height="135" rx="12" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="2" />
    <rect x="0" y="0" width="220" height="26" rx="12" fill="#1E1B4B" />
    <text x="16" y="17" fill="#A5B4FC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">03. RULE EVALUATION ENGINE</text>
    <text x="16" y="52" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="800">Strategy Engine</text>
    <text x="16" y="74" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">• 1h Momentum Spike Rules</text>
    <text x="16" y="92" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">• 1d Dip / Buy-The-Dip Limits</text>
    <text x="16" y="110" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" font-weight="600">• Absolute Price Trigger Crosses</text>
    <text x="16" y="126" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">LATENCY: &lt; 3ms EXECUTION</text>
  </g>

  <!-- Node 4: Instant Order Execution & Virtual Portfolio -->
  <g transform="translate(750, 110)">
    <rect width="220" height="95" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5" />
    <circle cx="24" cy="28" r="10" fill="#064E3B" />
    <circle cx="24" cy="28" r="4" fill="#34D399" class="pulse-dot" />
    <text x="44" y="26" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">04. SETTLEMENT</text>
    <text x="44" y="42" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Portfolio &amp; Orders</text>
    <text x="16" y="66" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Immediate simulated fill</text>
    <text x="16" y="80" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Cash ₹100k + Real-time PnL</text>
  </g>

  <!-- Node 5: SIP / Lumpsum Wealth Modeler -->
  <g transform="translate(750, 235)">
    <rect width="220" height="85" rx="10" fill="url(#cardGrad)" stroke="#7C3AED" stroke-width="1.5" />
    <circle cx="24" cy="26" r="10" fill="#3B0764" />
    <circle cx="24" cy="26" r="4" fill="#C084FC" class="pulse-dot" />
    <text x="44" y="24" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">05. COMPOUNDING</text>
    <text x="44" y="40" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700">SIP &amp; Lumpsum Calc</text>
    <text x="16" y="62" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Step-up compounding + Rule of 72</text>
  </g>
</svg>
