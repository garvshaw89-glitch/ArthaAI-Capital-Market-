<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" height="64">
  <defs>
    <linearGradient id="tickerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0B0E" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0B0E" stop-opacity="1" />
      <stop offset="100%" stop-color="#0A0B0E" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0B0E" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A0B0E" stop-opacity="1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes marqueeLoop {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1200px); }
    }
    .ticker-track {
      animation: marqueeLoop 24s linear infinite;
    }
    .ticker-track:hover {
      animation-play-state: paused;
    }
  </style>

  <!-- Container -->
  <rect width="1200" height="64" rx="10" fill="url(#tickerBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Ticker Label Fixed Pill on Left -->
  <g id="ticker-badge" transform="translate(14, 16)">
    <rect width="115" height="32" rx="6" fill="#161920" stroke="#312E81" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#34D399" />
    <text x="28" y="20" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5">NSE LIVE</text>
  </g>

  <!-- Overflow Clip for Marquee Track -->
  <g transform="translate(138, 0)" clip-path="url(#tickerClip)">
    <clipPath id="tickerClip">
      <rect x="0" y="0" width="1062" height="64" />
    </clipPath>

    <!-- Animated Continuous Track (Repeated Twice) -->
    <g class="ticker-track">
      <!-- SET 1 (Width ~1200) -->
      <g transform="translate(0, 16)">
        <!-- Stock 1: NIFTY 50 -->
        <g transform="translate(0, 0)">
          <text x="0" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">NIFTY 50</text>
          <text x="0" y="28" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">22,456.70</text>
          <text x="75" y="28" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">+0.85%</text>
          <line x1="140" y1="4" x2="140" y2="28" stroke="#334155" stroke-width="1" />
        </g>

        <!-- Stock 2: SENSEX -->
        <g transform="translate(160, 0)">
          <text x="0" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">SENSEX</text>
          <text x="0" y="28" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">73,903.15</text>
          <text x="75" y="28" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">+0.78%</text>
          <line x1="140" y1="4" x2="140" y2="28" stroke="#334155" stroke-width="1" />
        </g>

        <!-- Stock 3: BANK NIFTY -->
        <g transform="translate(320, 0)">
          <text x="0" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">BANK NIFTY</text>
          <text x="0" y="28" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">48,210.40</text>
          <text x="75" y="28" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">+0.86%</text>
          <line x1="140" y1="4" x2="140" y2="28" stroke="#334155" stroke-width="1" />
        </g>

        <!-- Stock 4: TATAMOTORS -->
        <g transform="translate(480, 0)">
          <text x="0" y="14" fill="#818CF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">TATAMOTORS</text>
          <text x="0" y="28" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">₹985.40</text>
          <text x="65" y="28" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">+4.21%</text>
          <rect x="120" y="16" width="62" height="15" rx="3" fill="#064E3B" />
          <text x="125" y="27" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">BUY SIGNAL</text>
          <line x1="195" y1="4" x2="195" y2="28" stroke="#334155" stroke-width="1" />
        </g>

        <!-- Stock 5: RELIANCE -->
        <g transform="translate(695, 0)">
          <text x="0" y="14" fill="#818CF8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">RELIANCE</text>
          <text x="0" y="28" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">₹2,940.15</text>
          <text x="75" y="28" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">+1.18%</text>
          <line x1="140" y1="4" x2="140" y2="28" stroke="#334155" stroke-width="1" />
        </g>

        <!-- Stock 6: INFY -->
        <g transform="translate(855, 0)">
          <text x="0" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">INFY</text>
          <text x="0" y="28" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">₹1,520.60</text>
          <text x="75" y="28" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">-0.85%</text>
          <line x1="140" y1="4" x2="140" y2="28" stroke="#334155" stroke-width="1" />
        </g>

        <!-- Stock 7: HDFCBANK -->
        <g transform="translate(1015, 0)">
          <text x="0" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">HDFCBANK</text>
          <text x="0" y="28" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">₹1,438.90</text>
          <text x="75" y="28" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">+0.65%</text>
          <line x1="140" y1="4" x2="140" y2="28" stroke="#334155" stroke-width="1" />
        </g>
      </g>

