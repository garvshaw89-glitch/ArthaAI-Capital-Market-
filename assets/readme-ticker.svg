      </g>
    </g>
  </g>

  <!-- Edge Fade Gradient Overlays -->
  <rect x="138" y="1" width="40" height="62" fill="url(#fadeLeft)" pointer-events="none" />
  <rect x="1150" y="1" width="48" height="62" fill="url(#fadeRight)" pointer-events="none" />
</svg>
